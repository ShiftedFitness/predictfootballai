[build]
  functions = "netlify/functions"
  publish = "public"
  # Skip the deploy ONLY when a commit touches nothing but the weekly analytics
  # report (a GitHub Action commits one every Sunday) and other non-site files.
  #
  # Exit 0 = skip. Exit anything else = build.
  #
  # INVERTED ON PURPOSE: this builds unless it can PROVE every changed file is
  # ignorable. The previous version asked the opposite question — "did git find
  # a difference?" — and every way of failing to find one meant "skip", which
  # is the wrong default when the cost of a wrong skip is a deploy that silently
  # never happens.
  #
  # It went wrong twice on 4 Oct 2026. Netlify could not fetch its cache, and
  # with no cache CACHED_COMMIT_REF comes back equal to COMMIT_REF. A diff
  # between a commit and itself is empty, so the rule reported "nothing changed"
  # and skipped — first a 382-file commit containing every team page, then the
  # commit that was meant to fix it. The failure is a deadlock: no build means
  # no cache, no cache means the refs match, matching refs mean no build.
  #
  # Hence the three guards before the diff is trusted at all. If anything is
  # missing, equal, unresolvable or unreadable, BUILD. A redundant deploy costs
  # two minutes; a skipped one costs however long it takes somebody to notice
  # the site never changed.
  ignore = '''
    set -u
    if [ -z "${CACHED_COMMIT_REF:-}" ]; then
      echo "ignore: no CACHED_COMMIT_REF — building."; exit 1
    fi
    if [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then
      echo "ignore: CACHED_COMMIT_REF equals COMMIT_REF ($COMMIT_REF) — nothing to compare, building."; exit 1
    fi
    if ! git cat-file -e "$CACHED_COMMIT_REF^{commit}" 2>/dev/null; then
      echo "ignore: $CACHED_COMMIT_REF is not in this clone — building."; exit 1
    fi
    CHANGED=$(git diff --name-only "$CACHED_COMMIT_REF" "$COMMIT_REF") || {
      echo "ignore: git diff failed — building."; exit 1
    }
    if [ -z "$CHANGED" ]; then
      echo "ignore: empty file list — building rather than assuming nothing changed."; exit 1
    fi
    if printf '%s\n' "$CHANGED" | grep -qvE '^(analytics/|[.]github/|[.]claude/|docs/|SESSION_LOG[.]md$)'; then
      echo "ignore: site files changed — building."; exit 1
    fi
    echo "ignore: only analytics/docs/log files changed — skipping."
    exit 0
  '''

# Cache headers: HTML pages should always revalidate, static assets can cache longer
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Auto-score: runs daily at 22:00 UTC (10pm) and 07:00 UTC (7am)
# Covers evening matches (checked next morning) and afternoon matches (checked same evening)
[functions."auto-score"]
  schedule = "0 7,22 * * *"

# The result-fetching runs as a BACKGROUND function. It paces one fixture
# every 6.5s to stay inside football-data.org's 10-requests-per-minute free
# tier, so a five-match week needs ~33 seconds — more than the 30-second
# ceiling Netlify applies to scheduled functions. In week 1 that cut off the
# last two fixtures, left the week half-resolved, and scoring then marked
# nearly every pick wrong.
[functions."auto-score-background"]
  background = true

# Picks reminder: checks every 30 minutes for matchweeks with first lockout ~2hrs away
# Sends personalised email to each user with their picks (or a warning if none submitted)
[functions."picks-reminder"]
  schedule = "*/30 * * * *"

# 23 sequential Gmail sends take ~35s; a scheduled function dies at 30, which
# truncated week 2's reminders at 19 recipients. The stamp lives after the
# loop, so it was never reached either — later ticks re-sent to the same 19
# and the last 4 could never get one.
[functions."picks-reminder-background"]
  background = true

# Picks AI: checks every 2 hours, but only ACTS when the week's first lockout
# is ~12 hours away (10-14h window). Deadlines move week to week, so the
# trigger is measured from each week's actual lockout rather than a fixed
# clock time. Twelve hours out means Friday press conferences have happened
# and team news is public.
#
# The 4-hour window is always hit by a 2-hourly cron, and the
# already-picked guard makes every other run a no-op that costs nothing —
# two cheap DB queries and an early return. Only the one run that lands
# inside the window spends anything.
[functions."picks-ai"]
  schedule = "0 */2 * * *"

# The work itself runs as a BACKGROUND function. A real run makes five
# server-side web searches plus a model call, which does not fit inside the
# 30-second ceiling Netlify applies to scheduled functions. Background
# functions get 15 minutes. picks-ai (cron) and picks-ai-trigger (manual)
# both hand off to this; it records every run in predict_ai_runs because a
# background function returns 202 with an empty body and cannot report back.
[functions."picks-ai-background"]
  background = true

# Odds refresh: re-reads Polymarket every 12 hours and updates the stored
# percentages for fixtures that have not locked yet. Scheduled a few hours
# ahead of each picks-ai run (09:00/18:00) so Picks AI always reasons over
# the freshest prices players can see. Locked fixtures are never touched —
# their stored odds are the record of what players saw when they picked.
[functions."refresh-odds"]
  schedule = "0 4,16 * * *"

# Weekly results email: checks every 30 minutes for a week that is fully
# scored, stamps scored_at on first sighting, and emails everyone an hour
# later. Sends exactly once per week (results_email_sent_at guard).
[functions."week-results"]
  schedule = "*/30 * * * *"

# ~24 sequential sends is well past the 30s scheduled-function ceiling.
[functions."week-results-background"]
  background = true

# "Week is open" announcement. Not scheduled — a seeded week may still need
# a fixture or deadline corrected before 23 people hear about it, so it goes
# out when the admin presses the button. ~23 sequential sends needs the
# background function's longer limit.
[functions."week-open-background"]
  background = true

# Shared modules revalidate like HTML, not like static assets.
#
# ts-analytics.js, ts-nav.js and the rest are the contract between every page
# and the shared code. A browser holding yesterday's ts-analytics.js while
# loading today's /upgrade/ is a page calling a method that does not exist —
# which is exactly what happened the first time the commercial events were
# added. They are a few kilobytes each; correctness is worth more than the
# bytes. The version-stamped libraries this site uses come from a CDN and are
# unaffected.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The global stylesheet, for the same reason as /js/*.
#
# It is the other half of the contract between every page and the shared code:
# a nav breakpoint lives in here, and a visitor holding a cached copy gets the
# old layout against new markup. It is one small file; correctness beats the
# bytes.
[[headers]]
  for = "/telestats-theme.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# A club we now present as one but FBref holds as two. The old URL was indexed
# and may be linked, so it redirects rather than 404s — 301 so the surviving
# page inherits whatever the old one had earned.
[[redirects]]
  from = "/teams/malaga-420/*"
  to = "/teams/malaga/"
  status = 301
  force = true
