[build]
  functions = "netlify/functions"
  publish = "public"

# Cache headers: HTML pages should always revalidate, static assets can cache longer
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Auto-score: runs daily at 22:00 UTC (10pm) and 07:00 UTC (7am)
# Covers evening matches (checked next morning) and afternoon matches (checked same evening)
[functions."auto-score"]
  schedule = "0 7,22 * * *"

# Picks reminder: checks every 30 minutes for matchweeks with first lockout ~2hrs away
# Sends personalised email to each user with their picks (or a warning if none submitted)
[functions."picks-reminder"]
  schedule = "*/30 * * * *"

# Picks AI: runs twice daily; only acts when a matchweek's first lockout is
# 2-60 hours away AND the bot has no picks for it yet, so the second run of
# the day is a no-op (and costs nothing) once the week is picked.
[functions."picks-ai"]
  schedule = "0 9,18 * * *"
