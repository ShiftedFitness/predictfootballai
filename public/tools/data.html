<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Analytics: GA4 via the central TeleStats helper (never loaded on /fives*) -->
<script src="/js/ts-analytics.js"></script>
<title>Data Coverage — TeleStats</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --card-alt: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    line-height: 1.5;
  }
  .container { max-width: 820px; margin: 0 auto; }

  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 20px; }

  /* Freshness banner — the whole reason this page exists */
  .freshness {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;
    background: var(--card); border: 1px solid var(--border);
    border-left-width: 3px; border-radius: 8px;
    padding: 14px 16px; margin-bottom: 18px;
  }
  .freshness.fresh { border-left-color: var(--green); }
  .freshness.aging { border-left-color: var(--yellow); }
  .freshness.stale { border-left-color: var(--red); }
  .freshness .big { font-size: 1.15rem; font-weight: 600; }
  .freshness.fresh .big { color: var(--green); }
  .freshness.aging .big { color: var(--yellow); }
  .freshness.stale .big { color: var(--red); }
  .freshness .note { color: var(--text-dim); font-size: 0.85rem; }

  .totals {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px; margin-bottom: 18px;
  }
  .totals div {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
  }
  .totals .k {
    display: block; font-size: 0.7rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 5px;
  }
  .totals .v { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }

  .table-wrap {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; overflow-x: auto;
  }
  table { border-collapse: collapse; width: 100%; min-width: 560px; }
  th, td {
    padding: 10px 14px; text-align: left; font-size: 0.875rem;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  th {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-dim); font-weight: 600; background: var(--card-alt);
  }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.comp { font-weight: 500; }
  .tier {
    display: inline-block; min-width: 20px; text-align: center;
    font-size: 0.7rem; font-weight: 600; padding: 1px 5px;
    border-radius: 4px; background: var(--card-alt);
    color: var(--text-dim); border: 1px solid var(--border);
  }
  .tier.t1 { color: var(--accent); border-color: var(--accent); }
  td.when { color: var(--text-dim); }
  td.when.old { color: var(--red); }

  .empty, .error { padding: 30px 16px; text-align: center; color: var(--text-dim); font-size: 0.9rem; }
  .error { color: var(--red); }
  .foot { margin-top: 14px; color: var(--text-dim); font-size: 0.78rem; }
  .foot a { color: var(--accent); }
  @media (max-width: 500px) { body { padding: 14px; } }
</style>
</head>
<body>
<div class="container">
  <h1>Data Coverage</h1>
  <p class="subtitle">Which competitions the games draw on, how far back each one goes, and when it was last refreshed.</p>

  <div id="out"><div class="empty">Loading…</div></div>

  <p class="foot">
    Player statistics are sourced from FBref. A competition's first season is the
    earliest FBref holds for it, not the competition's own first season.
    <a href="/tools/player-lookup.html">Player lookup →</a>
  </p>
</div>

<script>
(function () {
  var out = document.getElementById('out');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function ago(iso) {
    if (!iso) return { text: '—', days: null };
    var days = Math.floor((Date.now() - new Date(iso).getTime()) / 864e5);
    if (days < 1) return { text: 'today', days: days };
    if (days === 1) return { text: 'yesterday', days: days };
    if (days < 31) return { text: days + ' days ago', days: days };
    var months = Math.round(days / 30.44);
    return { text: months + (months === 1 ? ' month ago' : ' months ago'), days: days };
  }

  function num(n) { return (n == null ? 0 : n).toLocaleString(); }

  function render(d) {
    var f = ago(d.last_updated);
    // Anything past a month is stale for a site whose leagues play weekly.
    var state = f.days == null ? 'stale' : f.days <= 7 ? 'fresh' : f.days <= 31 ? 'aging' : 'stale';
    var label = { fresh: 'Up to date', aging: 'Getting old', stale: 'Out of date' }[state];

    var html =
      '<div class="freshness ' + state + '">' +
        '<span class="big">' + label + '</span>' +
        '<span class="note">Last refreshed ' + esc(f.text) +
          (d.last_updated ? ' &middot; ' + esc(new Date(d.last_updated).toLocaleDateString('en-GB',
             { day: 'numeric', month: 'short', year: 'numeric' })) : '') +
        '</span>' +
      '</div>';

    var t = d.totals || {};
    html +=
      '<div class="totals">' +
        '<div><span class="k">Competitions</span><span class="v">' + num(t.competitions) + '</span></div>' +
        '<div><span class="k">Player seasons</span><span class="v">' + num(t.rows) + '</span></div>' +
        '<div><span class="k">Earliest</span><span class="v">' + esc(t.earliest_season || '—') + '</span></div>' +
        '<div><span class="k">Latest</span><span class="v">' + esc(t.latest_season || '—') + '</span></div>' +
      '</div>';

    html +=
      '<div class="table-wrap"><table><thead><tr>' +
        '<th>Competition</th><th>Tier</th><th>From</th><th>To</th>' +
        '<th style="text-align:right">Rows</th><th>Updated</th>' +
      '</tr></thead><tbody>';

    (d.competitions || []).forEach(function (c) {
      var u = ago(c.last_updated);
      html +=
        '<tr>' +
          '<td class="comp">' + esc(c.competition) + '</td>' +
          '<td>' + (c.tier
              ? '<span class="tier t' + c.tier + '">' + esc(c.country || '') + ' ' + c.tier + '</span>'
              : '<span class="tier">' + esc(c.country || '—') + '</span>') + '</td>' +
          '<td>' + esc(c.first_season_label || '—') + '</td>' +
          '<td>' + esc(c.last_season_label || '—') + '</td>' +
          '<td class="num">' + num(c.rows) + '</td>' +
          '<td class="when' + (u.days != null && u.days > 31 ? ' old' : '') + '">' + esc(u.text) + '</td>' +
        '</tr>';
    });

    html += '</tbody></table></div>';
    out.innerHTML = html;
  }

  fetch('/.netlify/functions/data-summary')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error) throw new Error(d.error);
      render(d);
    })
    .catch(function (e) {
      out.innerHTML = '<div class="error">Could not load coverage data.<br>' + esc(e.message) + '</div>';
    });
})();
</script>
</body>
</html>
